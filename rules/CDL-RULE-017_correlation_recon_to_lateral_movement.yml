title: Domain Reconnaissance Followed by Remote Execution (Recon to Lateral Movement)
id: 8c1d5e2a-3b9f-4710-a2e6-1f0b9c3e2017
status: stable
description: Correlation rule detecting internal Active Directory reconnaissance (net group, nltest, adfind) executed on a host, immediately followed within 10 minutes by lateral movement execution (WMI process creation or PsExec service installation) initiated by the same user account.
references:
  - https://attack.mitre.org/techniques/T1087/
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1047/
author: Cyberion Detection Engineering
date: 2026-10-08
tags:
  - attack.discovery
  - attack.lateral_movement
  - attack.t1087
  - attack.t1021.002
  - attack.t1047
action: correlation
type: ordered_sequence
correlation:
  type: temporal
  rules:
    - rule_stage1_recon
    - rule_stage2_lateral
  group-by:
    - User
    - ComputerName
  timespan: 10m
  condition:
    rule_stage1_recon: '>= 1'
    rule_stage2_lateral: '>= 1'
logsource:
  category: process_creation
  product: windows
detection:
  rule_stage1_recon:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
      - '\nltest.exe'
      - '\adfind.exe'
    CommandLine|contains:
      - 'group "Domain Admins"'
      - '/domain'
      - '/dclist:'
  rule_stage2_lateral:
    CommandLine|contains:
      - 'wmic'
      - 'process call create'
      - 'psexec'
      - 'PSEXESVC'
falsepositives:
  - Systems administrators running ad-hoc domain troubleshooting scripts before managing remote servers.
level: high
fields:
  - ComputerName
  - User
  - Image
  - CommandLine
rational: High severity because adversaries systematically query domain architecture immediately before attempting credentialed lateral movement hops.
