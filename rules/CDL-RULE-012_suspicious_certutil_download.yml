title: Ingress Tool Transfer via Certutil Living-Off-The-Land Binary
id: 8d3e1a7b-9c4f-4208-a5b1-6e9f2c8d1012
status: stable
description: Detects the use of certutil.exe to download remote files via command-line flags (-urlcache, -split, -f) or decode base64 payloads (-decode), a common Living-Off-The-Land technique for staging malware.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Cyberion Detection Engineering
date: 2026-10-08
tags:
  - attack.command_and_control
  - attack.defense_evasion
  - attack.t1105
  - attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\certutil.exe'
  selection_flags:
    CommandLine|contains:
      - '-urlcache'
      - '/urlcache'
      - '-split'
      - '/split'
      - '-decode'
      - '/decode'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
  condition: selection_img and (selection_flags and selection_url)
falsepositives:
  - Rare legitimate administrative certificate revocation list (CRL) troubleshooting using explicit URLs.
level: high
fields:
  - ComputerName
  - User
  - Image
  - CommandLine
  - ParentImage
rational: High severity because certutil is signed by Microsoft and trusted by default, making it an ideal staging vehicle for attackers to evade web content filters.
