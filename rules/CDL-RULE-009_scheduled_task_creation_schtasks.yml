title: Suspicious Scheduled Task Creation via Schtasks
id: 2e8b1d9c-5a4f-4712-9c0e-3b6f8a7d4009
status: stable
description: Detects scheduled tasks created via the schtasks command-line utility configured to run under SYSTEM or elevated context, pointing to script interpreters or executable files in writable paths.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Cyberion Detection Engineering
date: 2026-10-08
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_action:
    CommandLine|contains:
      - '/create'
      - '-create'
  selection_target:
    CommandLine|contains:
      - 'powershell'
      - 'cmd.exe'
      - 'wscript'
      - 'cscript'
      - 'mshta'
      - '\AppData\'
      - '\Temp\'
      - 'C:\Users\Public\'
  selection_system:
    CommandLine|contains:
      - '/ru system'
      - '/ru "system"'
      - '/ru NT AUTHORITY\SYSTEM'
  condition: selection_img and selection_action and (selection_target or selection_system)
falsepositives:
  - Enterprise software updates (e.g. Adobe, Google Update, browser updaters) configuring scheduled tasks.
level: medium
fields:
  - ComputerName
  - User
  - Image
  - CommandLine
  - ParentImage
rational: Medium severity because scheduled tasks provide persistent survival across reboots and execution privileges under LocalSystem.
