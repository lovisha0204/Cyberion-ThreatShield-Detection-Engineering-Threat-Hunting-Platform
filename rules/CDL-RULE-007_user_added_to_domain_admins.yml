title: Account Added to Privileged Domain Security Group
id: 4b9e2c1a-8f3d-4762-b10c-5e9a8f2d1007
status: stable
description: Detects the addition of user accounts to high-privileged Active Directory groups such as Domain Admins, Enterprise Admins, or Schema Admins via Windows Security Event IDs 4728 or 4732.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://attack.mitre.org/techniques/T1078/002/
author: Cyberion Detection Engineering
date: 2026-10-08
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
  - attack.t1078.002
logsource:
  category: security
  product: windows
detection:
  selection_event:
    EventID:
      - 4728
      - 4732
      - 4756
  selection_group:
    TargetUserName|contains:
      - 'Domain Admins'
      - 'Enterprise Admins'
      - 'Schema Admins'
      - 'Administrators'
  condition: selection_event and selection_group
falsepositives:
  - Legitimate authorized administrative provisioning during approved change windows.
level: high
fields:
  - ComputerName
  - SubjectUserName
  - TargetUserName
  - MemberName
rational: High severity because unauthorized elevation into Domain Admins provides persistent administrative control across all domain assets.
